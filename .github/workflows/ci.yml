# =====================================================================================
# Continuous integration (ci-cd.md: build → unit test → Sonar → docker build → push).
#
# Split into stages that fail fast: compile and unit tests gate everything, integration tests
# and image builds run in parallel afterwards, and images are only pushed from the default
# branch and from tags.
# =====================================================================================
name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'commerceflow' }}
  MAVEN_ARGS: "-B -ntp -Dstyle.color=never"

jobs:

  # ------------------------------------------------------------------ build + unit tests
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs the full history to attribute new code correctly.
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and run unit tests
        run: mvn $MAVEN_ARGS clean verify

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "**/target/surefire-reports/TEST-*.xml"
          check_name: Unit tests
          fail_on_failure: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-reports
          path: "**/target/site/jacoco/"
          retention-days: 7

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: application-jars
          path: |
            services/*/target/*.jar
            gateway/*/target/*.jar
          retention-days: 3

  # ------------------------------------------------------------------ integration tests
  integration-test:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Testcontainers needs a Docker daemon; ubuntu-latest already has one.
      - name: Run integration tests
        run: mvn $MAVEN_ARGS verify -Pintegration
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"
          TESTCONTAINERS_CHECKS_DISABLE: "true"

      - name: Publish integration test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "**/target/failsafe-reports/TEST-*.xml"
          check_name: Integration tests
          fail_on_failure: true

  # ------------------------------------------------------------------ static analysis
  sonar:
    name: Sonar scan
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    # Skipped rather than failed when no token is configured, so a fork can still run CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache Sonar packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: Scan
        if: secrets.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn $MAVEN_ARGS verify sonar:sonar \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'commerceflow' }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'commerceflow' }} \
            -Dsonar.host.url=$SONAR_HOST_URL

      - name: Report skip
        if: secrets.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN is not configured; skipping the scan." >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------------ container images
  docker:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            dockerfile: services/auth-service/Dockerfile
          - service: inventory-service
            dockerfile: services/inventory-service/Dockerfile
          - service: order-service
            dockerfile: services/order-service/Dockerfile
          - service: payment-service
            dockerfile: services/payment-service/Dockerfile
          - service: notification-service
            dockerfile: services/notification-service/Dockerfile
          - service: api-gateway
            dockerfile: gateway/spring-cloud-gateway/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Pushing is only meaningful from the canonical repository: a pull request from a fork
        # has no access to the registry credentials, and should not be pushing images anyway.
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=commerceflow-${{ matrix.service }}
            org.opencontainers.image.vendor=CommerceFlow

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false

  # ------------------------------------------------------------------ summary gate
  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    needs: [build, integration-test, docker]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ needs.build.result }}" != "success" ] \
             || [ "${{ needs.integration-test.result }}" != "success" ] \
             || [ "${{ needs.docker.result }}" != "success" ]; then
            echo "One or more required jobs failed." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "All CI stages passed." >> $GITHUB_STEP_SUMMARY
