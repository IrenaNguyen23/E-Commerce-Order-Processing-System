server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  tomcat:
    threads:
      max: 200

spring:
  servlet:
    multipart:
      # Sits in front of commerceflow.inventory.max-image-bytes. Both have to let a file
      # through; this one is deliberately the more generous of the two, so the message a
      # customer sees comes from the application ("the limit is 2048 kB") rather than from
      # Tomcat rejecting the request before any of our code runs.
      max-file-size: 4MB
      max-request-size: 6MB
  application:
    name: inventory-service

  config:
    import: classpath:commerceflow-kafka.yml

  main:
    banner-mode: "off"

  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:true}

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:commerceflow_inventory}
    username: ${POSTGRES_USER:commerceflow}
    password: ${POSTGRES_PASSWORD:commerceflow}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: inventory-pool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 900000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (ADR-007); Hibernate only verifies the mapping against it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 1

  kafka:
    consumer:
      group-id: inventory-service

commerceflow:
  inventory:
    reservation:
      # A healthy hold lives seconds; one that needed chasing, minutes. Anything still holding
      # stock this long belongs to something that broke — the window only decides how patient
      # we are before saying so.
      stale-after: ${RESERVATION_STALE_AFTER:2h}
      scan-interval-ms: ${RESERVATION_SCAN_INTERVAL_MS:600000}
      scan-batch-size: ${RESERVATION_SCAN_BATCH_SIZE:200}
  security:
    jwt:
      # Every service verifies tokens with the same key; MUST be injected from a secret.
      secret: ${JWT_SECRET:commerceflow-local-development-secret-change-me-before-production}
      issuer: ${JWT_ISSUER:commerceflow}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
      clock-skew: 30s
  outbox:
    enabled: true
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: 100
    max-attempts: 10
    retention: 7d
  idempotency:
    cleanup-enabled: true
    retention: 7d
  openapi:
    public-url: ${GATEWAY_PUBLIC_URL:http://localhost:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: CommerceFlow product catalogue and stock ownership
    version: 1.0.0
