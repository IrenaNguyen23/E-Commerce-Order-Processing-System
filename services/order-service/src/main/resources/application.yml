server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  tomcat:
    threads:
      max: 200

spring:
  application:
    name: order-service

  config:
    import: classpath:commerceflow-kafka.yml

  main:
    banner-mode: "off"

  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:true}

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:commerceflow_order}
    username: ${POSTGRES_USER:commerceflow}
    password: ${POSTGRES_PASSWORD:commerceflow}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: order-pool
      maximum-pool-size: ${DB_POOL_SIZE:25}
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 900000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (ADR-007); Hibernate only verifies the mapping against it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 1

  kafka:
    consumer:
      group-id: order-service

commerceflow:
  security:
    jwt:
      # Every service verifies tokens with the same key; MUST be injected from a secret.
      secret: ${JWT_SECRET:commerceflow-local-development-secret-change-me-before-production}
      issuer: ${JWT_ISSUER:commerceflow}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
      clock-skew: 30s
  outbox:
    enabled: true
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: 100
    max-attempts: 10
    retention: 7d
  idempotency:
    cleanup-enabled: true
    retention: 7d
  openapi:
    public-url: ${GATEWAY_PUBLIC_URL:http://localhost:8080}
  order:
    # Prefix of the human readable order number, e.g. CF-20260826-000123.
    number-prefix: ${ORDER_NUMBER_PREFIX:CF}
    max-items-per-order: ${ORDER_MAX_ITEMS:50}
    read-model-cache-ttl: ${ORDER_READ_CACHE_TTL:2m}
    saga:
      # How long a participant has to answer a command before the orchestrator chases it.
      # This is when a command is re-sent, not when anything is given up on.
      step-timeout: ${SAGA_STEP_TIMEOUT:2m}
      # Sends per step before the saga is parked for an operator. Two extra tries is enough to
      # ride out a restart; more only means the participant is down.
      max-attempts: ${SAGA_MAX_ATTEMPTS:3}
      scan-interval-ms: ${SAGA_SCAN_INTERVAL_MS:30000}
      scan-batch-size: ${SAGA_SCAN_BATCH_SIZE:100}
  client:
    inventory:
      # Static DNS, no service registry (ADR-003).
      base-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
      connect-timeout: 2s
      read-timeout: 3s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: CommerceFlow order command side and CQRS read model
    version: 1.0.0
