# =====================================================================================
# API Gateway
#
# Single entry point (ADR-002): routing, JWT verification, rate limiting, circuit breaking.
# =====================================================================================
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: commerceflow
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: commerceflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: commerceflow
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: commerceflow
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never take capacity away during a rollout: one extra pod, none missing.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: edge
        app.kubernetes.io/part-of: commerceflow
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: commerceflow
      # Spread replicas across nodes so a single node failure cannot take the whole service down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Long enough for in-flight requests to finish; the app also shuts down gracefully.
      terminationGracePeriodSeconds: 45
      containers:
        - name: api-gateway
          image: "docker.io/commerceflow/api-gateway:1.0.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: commerceflow-config
            - secretRef:
                name: commerceflow-secrets
          env:
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8080"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8080"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:8080"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8080"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8080"
          # A startup probe rather than a long initialDelay on liveness: the JVM and Flyway
          # can take a while on a cold start, but once warm a hang should be caught quickly.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The filesystem is read-only, but the JVM still needs somewhere to write temporary
            # files and heap dumps.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: commerceflow
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: commerceflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      # React quickly to a traffic spike.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Come back down slowly: flapping replicas cost more than the capacity they save, and
      # every scale-down forces a Kafka consumer group rebalance.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pod
          value: 1
          periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: commerceflow
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: commerceflow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
