apiVersion: v1
kind: Namespace
metadata:
  name: commerceflow
  labels:
    app.kubernetes.io/part-of: commerceflow
    app.kubernetes.io/managed-by: kubectl
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Every workload runs under this account rather than `default`, so RBAC can be tightened later
# without touching a single Deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: commerceflow
  namespace: commerceflow
  labels:
    app.kubernetes.io/part-of: commerceflow
automountServiceAccountToken: false
---
# A namespace-wide guard rail: a runaway Deployment cannot starve the rest of the cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: commerceflow-quota
  namespace: commerceflow
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "10"
---
# Containers that forget to declare resources still get sane ones.
apiVersion: v1
kind: LimitRange
metadata:
  name: commerceflow-limits
  namespace: commerceflow
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 768Mi
      defaultRequest:
        cpu: 100m
        memory: 384Mi
