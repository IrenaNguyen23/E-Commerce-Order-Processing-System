apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# One entry point for the whole platform:
#
#   kubectl apply -k k8s/
#
# CI overrides the image tags per deploy with `kustomize edit set image`, so the manifests
# themselves never carry a build number.

namespace: commerceflow

commonLabels:
  app.kubernetes.io/part-of: commerceflow
  app.kubernetes.io/managed-by: kustomize

resources:
  - 00-namespace.yaml
  - 01-config.yaml
  - 02-postgres.yaml
  - 03-redis.yaml
  - 04-kafka.yaml
  - 10-auth-service.yaml
  - 11-inventory-service.yaml
  - 12-order-service.yaml
  - 13-payment-service.yaml
  - 14-notification-service.yaml
  - 15-api-gateway.yaml
  - 20-ingress.yaml
  - 21-networkpolicy.yaml

images:
  - name: docker.io/commerceflow/auth-service
    newTag: 1.0.0
  - name: docker.io/commerceflow/inventory-service
    newTag: 1.0.0
  - name: docker.io/commerceflow/order-service
    newTag: 1.0.0
  - name: docker.io/commerceflow/payment-service
    newTag: 1.0.0
  - name: docker.io/commerceflow/notification-service
    newTag: 1.0.0
  - name: docker.io/commerceflow/api-gateway
    newTag: 1.0.0
