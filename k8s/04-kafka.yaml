# =====================================================================================
# Kafka in KRaft mode — no ZooKeeper.
#
# Single broker, sized for a development or staging cluster. In production this is replaced by
# a managed cluster or the Strimzi operator; the services only know the `kafka:9092` DNS name,
# so nothing in the application changes.
#
# The saga topics are created by a Job rather than by auto-creation: every topic is partitioned
# by order id so one order is always processed in order, and that only holds if the partition
# count is deliberate.
# =====================================================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: commerceflow
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: commerceflow
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 29093
      targetPort: 29093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: commerceflow
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: commerceflow
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: commerceflow
    spec:
      serviceAccountName: commerceflow
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.7.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 29093
          env:
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-0.kafka.commerceflow.svc.cluster.local:29093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - kafka-topics --bootstrap-server localhost:9092 --list
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
# Creates every saga topic and its dead-letter counterpart with a deliberate partition count.
# Idempotent, so it is safe to re-run on every deploy.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-bootstrap
  namespace: commerceflow
  labels:
    app.kubernetes.io/part-of: commerceflow
  annotations:
    # Re-applied on every deploy; delete the completed Job first if you use plain kubectl apply.
    helm.sh/hook: post-install,post-upgrade
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: commerceflow
    spec:
      restartPolicy: OnFailure
      serviceAccountName: commerceflow
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-topics
          image: confluentinc/cp-kafka:7.7.1
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              BOOTSTRAP=kafka:9092
              echo "Waiting for Kafka at ${BOOTSTRAP}"
              until kafka-topics --bootstrap-server "${BOOTSTRAP}" --list >/dev/null 2>&1; do
                sleep 5
              done
              for topic in order.created order.completed order.cancelled \
                           inventory.reserved inventory.failed inventory.released \
                           payment.completed payment.failed \
                           notification.send notification.sent; do
                for name in "${topic}" "${topic}.DLT"; do
                  echo "Ensuring topic ${name}"
                  kafka-topics --bootstrap-server "${BOOTSTRAP}" --create --if-not-exists \
                    --topic "${name}" --partitions 3 --replication-factor 1 \
                    --config retention.ms=604800000 --config cleanup.policy=delete
                done
              done
              echo "Topics ready."
              kafka-topics --bootstrap-server "${BOOTSTRAP}" --list | sort
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
