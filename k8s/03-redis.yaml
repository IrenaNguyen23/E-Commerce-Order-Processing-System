# =====================================================================================
# Redis 7.
#
# Everything Redis holds here is disposable — the logout deny-list, read caches and rate-limit
# buckets — so a single replica with a small volume is the right trade. Losing it costs a few
# cache misses; it cannot lose an order.
# =====================================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: commerceflow
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode no
    port 6379
    tcp-keepalive 300
    maxmemory 512mb
    # Evict rather than refuse writes: a full cache must never take the platform down.
    maxmemory-policy allkeys-lru
    save 900 1
    appendonly no
    loglevel notice
    lua-time-limit 5000
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: commerceflow
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: commerceflow
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: commerceflow
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: commerceflow
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: commerceflow
    spec:
      serviceAccountName: commerceflow
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/redis
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: redis-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
