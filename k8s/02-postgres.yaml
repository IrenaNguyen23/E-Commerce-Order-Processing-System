# =====================================================================================
# PostgreSQL 16.
#
# A single StatefulSet with five databases inside it (ADR-005 is about ownership, not about
# hardware). This manifest is intended for a development or staging cluster; in production
# point the services at a managed instance and delete this file — nothing else changes,
# because every service only knows the `postgres` DNS name and its own database.
# =====================================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: commerceflow
data:
  01-create-databases.sh: |
    #!/bin/bash
    set -euo pipefail
    for database in commerceflow_auth commerceflow_order commerceflow_inventory \
                    commerceflow_payment commerceflow_notification; do
      echo "Creating database ${database}"
      psql -v ON_ERROR_STOP=1 --username "${POSTGRES_USER}" --dbname postgres <<-EOSQL
        SELECT 'CREATE DATABASE ${database}'
         WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '${database}')\gexec
        GRANT ALL PRIVILEGES ON DATABASE ${database} TO ${POSTGRES_USER};
    EOSQL
    done
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: commerceflow
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: commerceflow
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: commerceflow
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: commerceflow
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: commerceflow
    spec:
      serviceAccountName: commerceflow
      securityContext:
        runAsNonRoot: true
        # postgres:16-alpine runs as uid/gid 70, not the 999 of the Debian variant.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: commerceflow-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerceflow-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: commerceflow
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d commerceflow"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d commerceflow"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
