# Minimal overrides so the gateway context can start in a unit test without Redis or downstream
# services. Routes and rate limiting are exercised by the Testcontainers integration test instead.
spring:
  cloud:
    gateway:
      routes: []
  data:
    redis:
      host: localhost
      port: 6379

commerceflow:
  security:
    jwt:
      secret: commerceflow-unit-test-secret-key-of-at-least-32-bytes
      issuer: commerceflow

management:
  tracing:
    enabled: false
