# =====================================================================================
# CommerceFlow Web — production server.
#
# Serves the built SPA and proxies /api to the gateway, which keeps the browser same-origin:
# no CORS preflight, no third-party cookie rules, and the same URL shape as the Vite dev proxy.
# =====================================================================================

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Never trust the upstream to set these.
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "DENY"           always;
    add_header Referrer-Policy        "same-origin"    always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    client_max_body_size 2m;

    # ---- API ---------------------------------------------------------------------------
    # `resolver` plus a variable upstream so nginx re-resolves DNS at request time. Without
    # it, nginx caches the gateway's IP at startup and a redeployed gateway pod becomes
    # permanently unreachable until nginx itself is restarted.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway "${GATEWAY_URL}";

        proxy_pass         $gateway;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        # Longer than the client's own timeout: the browser should give up first and show its
        # own message, rather than nginx returning a 504 the app cannot explain.
        proxy_read_timeout    30s;

        proxy_buffering off;
    }

    # ---- static assets ------------------------------------------------------------------
    # Vite fingerprints every filename, so these are immutable and can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:svg|ico|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- SPA fallback --------------------------------------------------------------------
    # index.html must never be cached: it is the only file whose name does not change, and it
    # carries the references to the fingerprinted bundles. A stale copy pins users to an old
    # build permanently.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container health, answered by nginx itself — no dependency on the gateway being up.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
