# =====================================================================================
# Prometheus scrape configuration (ADR-008).
#
# Static targets: the compose network resolves service names, and there is no service
# registry to discover from (ADR-003).
# =====================================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: commerceflow
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: commerceflow-services
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          service: api-gateway
      - targets: ["auth-service:8080"]
        labels:
          service: auth-service
      - targets: ["order-service:8080"]
        labels:
          service: order-service
      - targets: ["inventory-service:8080"]
        labels:
          service: inventory-service
      - targets: ["payment-service:8080"]
        labels:
          service: payment-service
      - targets: ["notification-service:8080"]
        labels:
          service: notification-service
