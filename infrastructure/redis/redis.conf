# =====================================================================================
# Redis configuration for local development and the compose stack.
#
# Redis holds two kinds of data here, both of them disposable:
#   * the logout deny-list of revoked access tokens (Auth Service)
#   * read caches and rate-limit buckets (Gateway, Order, Inventory)
#
# Losing any of it costs a few cache misses and shortens nothing that matters, so persistence
# is deliberately light and the eviction policy favours availability over retention.
# =====================================================================================

bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Cap memory and evict the least recently used key rather than start refusing writes: a full
# cache must never be able to take the platform down.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Light persistence: enough to survive a restart, not enough to slow the hot path.
save 900 1
save 300 10
appendonly no

databases 16
loglevel notice

# Rate limiting relies on Lua scripts; keep the cache generous.
lua-time-limit 5000
